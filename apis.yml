name: Sidecar Health
description: >-
  Sidecar Health is an American health-insurance company founded in 2018 by Patrick
  Quigley and Veronica Osetinsky and headquartered in Columbus, Ohio. It offers
  ACA-compliant major medical plans for large employers, available both fully
  insured and as administrative-services-only (ASO) coverage for self-funded
  employers. Its model centers on transparent, upfront cash pricing and open
  provider access with no provider network and no prior-authorization requirement:
  members may see any provider and, after meeting their deductible, pay only charges
  above an assigned benefit amount. The company raised a $165M Series D led by Koch
  Disruptive Technologies in 2024, and its plans are offered in Florida, Georgia,
  and Ohio. Sidecar Health publishes no public developer platform or API; this
  profile captures its verifiable web, security, and trust surfaces.
